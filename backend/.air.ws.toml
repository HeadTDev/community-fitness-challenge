root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/ws ./cmd/ws/main.go"
bin = "tmp/ws"
full_bin = "APP_ENV=dev ./tmp/ws"
include_ext = ["go", "toml", "env", "yaml", "yml"]
exclude_dir = ["assets", "tmp", "vendor", "test", "bin"]
include_dir = []
exclude_file = []
log = "air.ws.log"
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
