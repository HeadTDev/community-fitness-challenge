services:
  postgres:
    image: postgres:18-alpine
    container_name: fc-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-fc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fc_password}
      POSTGRES_DB: ${DB_NAME:-fitchallenge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fc_user} -d ${DB_NAME:-fitchallenge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: fc-redis
    restart: always
    volumes:
      - redis-data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack-pro:latest
    container_name: fc-localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - PERSISTENCE=${PERSISTENCE:-1}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - "./infra/localstack:/etc/localstack/init/ready.d"
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - app-net
      - data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fc-api
    restart: always
    environment:
      - API_PORT=${API_PORT:-8080}
      - DB_USER=${DB_USER:-fc_user}
      - DB_PASSWORD=${DB_PASSWORD:-fc_password}
      - DB_NAME=${DB_NAME:-fitchallenge}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-fitchallenge_super_secret_key}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=http://localstack:4566
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    networks:
      - app-net
      - data-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fc-worker
    restart: always
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      - DB_USER=${DB_USER:-fc_user}
      - DB_PASSWORD=${DB_PASSWORD:-fc_password}
      - DB_NAME=${DB_NAME:-fitchallenge}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    networks:
      - app-net
      - data-net

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fc-migrate
    environment:
      - DB_USER=${DB_USER:-fc_user}
      - DB_PASSWORD=${DB_PASSWORD:-fc_password}
      - DB_NAME=${DB_NAME:-fitchallenge}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
    command: go run cmd/migrate/main.go -dir up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - data-net

  verifier:
    image: alpine:3.19
    container_name: fc-verifier
    depends_on:
      api:
        condition: service_started
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      - API_HOST=api
      - API_PORT=8080
      - DB_HOST=postgres
      - DB_USER=fc_user
      - DB_PASSWORD=${DB_PASSWORD:-fc_password}
      - DB_NAME=fitchallenge
      - PGPASSWORD=${DB_PASSWORD:-fc_password}
      - REDIS_HOST=redis
      - LOCALSTACK_HOST=localstack
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq postgresql-client redis bash dos2unix && dos2unix tests/verify_infra.sh && chmod +x tests/verify_infra.sh && ./tests/verify_infra.sh"]
    networks:
      - app-net
      - data-net
    profiles:
      - test

networks:
  app-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true # Senior tipp: Az adatbázisok ne legyenek közvetlenül elérhetőek kívülről, csak proxy-n vagy bastion-on keresztül.

volumes:
  postgres-data:
  redis-data:
